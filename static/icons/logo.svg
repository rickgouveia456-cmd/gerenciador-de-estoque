<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" fill="none">
  <defs>
    <linearGradient id="gBox" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff8a50"/>
      <stop offset="100%" stop-color="#ff4500"/>
    </linearGradient>
    <linearGradient id="gBoxDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff6b35"/>
      <stop offset="100%" stop-color="#cc3300"/>
    </linearGradient>
  </defs>

  <!-- ═══ ÍCONE: letra L + pirâmide de caixas ═══ -->

  <!-- Letra L (bold, fundo escuro) -->
  <!-- Haste vertical -->
  <rect x="4" y="6" width="10" height="48" rx="2" fill="#1e293b"/>
  <!-- Haste horizontal -->
  <rect x="4" y="44" width="36" height="10" rx="2" fill="#1e293b"/>

  <!-- Pirâmide de caixas no topo do L -->
  <!-- Nível 3 (base) — 3 caixas pequenas -->
  <rect x="4"  y="26" width="10" height="10" rx="1.5" fill="url(#gBoxDark)" stroke="#ff8a50" stroke-width="0.5"/>
  <rect x="16" y="26" width="10" height="10" rx="1.5" fill="url(#gBox)"     stroke="#ff8a50" stroke-width="0.5"/>
  <rect x="28" y="26" width="10" height="10" rx="1.5" fill="url(#gBoxDark)" stroke="#ff8a50" stroke-width="0.5"/>

  <!-- Nível 2 (meio) — 2 caixas -->
  <rect x="10" y="14" width="10" height="10" rx="1.5" fill="url(#gBox)"     stroke="#ff8a50" stroke-width="0.5"/>
  <rect x="22" y="14" width="10" height="10" rx="1.5" fill="url(#gBoxDark)" stroke="#ff8a50" stroke-width="0.5"/>

  <!-- Nível 1 (topo) — 1 caixa -->
  <rect x="16" y="4"  width="10" height="8"  rx="1.5" fill="#ff6b35" stroke="#ff8a50" stroke-width="0.8"/>
  <!-- Pequena seta/detalhe no topo da caixa do ápice -->
  <path d="M21 4 L21 1" stroke="#ff6b35" stroke-width="1.5" stroke-linecap="round"/>

  <!-- ═══ TEXTO ═══ -->
  <!-- "Logi" bold escuro -->
  <text x="50" y="36"
        font-family="'Segoe UI Black','Arial Black',Arial,sans-serif"
        font-size="20" font-weight="900"
        fill="#1e293b" letter-spacing="-0.5">Logi</text>

  <!-- "-Prime" laranja bold -->
  <text x="93" y="36"
        font-family="'Segoe UI Black','Arial Black',Arial,sans-serif"
        font-size="20" font-weight="900"
        fill="#ff6b35" letter-spacing="-0.5">-Prime</text>

  <!-- Subtítulo fino -->
  <text x="51" y="48"
        font-family="'Segoe UI',Arial,sans-serif"
        font-size="7" font-weight="400"
        fill="#94a3b8" letter-spacing="2">GESTÃO DE OBRA</text>
</svg>

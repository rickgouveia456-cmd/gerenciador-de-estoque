<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 44" fill="none">
  <defs>
    <linearGradient id="sf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="ss" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>
    <linearGradient id="st" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
  </defs>

  <!-- Face frontal -->
  <path d="M2 24 L2 38 L18 41 L18 27 Z" fill="url(#sf)"/>

  <!-- Face lateral direita -->
  <path d="M18 27 L18 41 L30 37 L30 23 Z" fill="url(#ss)"/>

  <!-- Aba esquerda aberta -->
  <path d="M2 24 L2 18 L10 15 L18 19 L18 27 Z" fill="url(#st)"/>

  <!-- Aba direita aberta -->
  <path d="M18 19 L30 15 L30 23 L18 27 Z" fill="url(#ss)" opacity="0.85"/>

  <!-- Linha junção -->
  <path d="M18 27 L18 41" stroke="#9a3412" stroke-width="0.7"/>

  <!-- Seta -->
  <rect x="14" y="5" width="4" height="13" rx="2"
        fill="url(#st)"
        transform="rotate(45 16 11.5)"/>
  <polygon points="24,2  30,8  27,9  25,5  21,3"
           fill="#fb923c"/>

  <!-- Texto "Logi" -->
  <text x="40" y="28"
        font-family="'Segoe UI Black','Arial Black',sans-serif"
        font-size="18" font-weight="900"
        fill="#ffffff" letter-spacing="-0.3">Logi</text>

  <!-- "-Prime" laranja -->
  <text x="82" y="28"
        font-family="'Segoe UI Black','Arial Black',sans-serif"
        font-size="18" font-weight="900"
        fill="#f97316" letter-spacing="-0.3">-Prime</text>

  <!-- Subtítulo -->
  <text x="41" y="38"
        font-family="'Segoe UI',Arial,sans-serif"
        font-size="5" fill="rgba(255,255,255,0.45)" letter-spacing="1.8">GESTÃO DE OBRA</text>
</svg>

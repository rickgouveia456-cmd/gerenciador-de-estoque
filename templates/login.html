<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Logi-Prime</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #ff6b35 0%, #ff8a50 100%);
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            font-family: 'Segoe UI', sans-serif;
        }
        .login-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 48px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
        }
        .logo {
            background: linear-gradient(135deg, #ff6b35 0%, #ff8a50 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 2.2rem;
            font-weight: 900;
            text-align: center;
            margin-bottom: 8px;
            letter-spacing: -1px;
        }
        .logo span {
            color: #ff5722;
        }
        .logo-sub {
            text-align: center;
            font-size: 0.8rem;
            color: #64748b;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 32px;
            font-weight: 500;
        }
        .form-label {
            color: #1e293b;
            font-weight: 600;
            font-size: 0.9rem;
        }
        .form-control {
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }
        .form-control:focus {
            border-color: #ff6b35;
            box-shadow: 0 0 0 3px rgba(255, 107, 53, 0.1);
        }
        .input-group-text {
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            border-right: none;
            color: #64748b;
            border-radius: 10px 0 0 10px;
        }
        .input-group .form-control {
            border-left: none;
            border-radius: 0 10px 10px 0;
        }
        .input-group:focus-within .input-group-text {
            border-color: #ff6b35;
            background: rgba(255, 107, 53, 0.05);
        }
        .btn-login {
            background: linear-gradient(135deg, #ff6b35 0%, #ff8a50 100%);
            border: none;
            color: #fff;
            padding: 14px;
            font-weight: 600;
            border-radius: 12px;
            width: 100%;
            font-size: 1rem;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px 0 rgba(255, 107, 53, 0.3);
        }
        .btn-login:hover { 
            background: linear-gradient(135deg, #ff5722 0%, #ff6b35 100%);
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px 0 rgba(255, 107, 53, 0.4);
        }
        .btn-login:active {
            transform: translateY(0);
        }
        .divider {
            border-top: 1px solid #e2e8f0;
            margin: 28px 0 20px;
        }
        .version {
            text-align: center;
            font-size: 0.75rem;
            color: #94a3b8;
            margin-top: 24px;
            font-weight: 500;
        }
        .alert {
            border-radius: 10px;
            border: none;
            font-size: 0.9rem;
        }
        .alert-danger {
            background: rgba(220, 38, 38, 0.1);
            color: #dc2626;
        }
        .alert-success {
            background: rgba(5, 150, 105, 0.1);
            color: #059669;
        }
        .alert-warning {
            background: rgba(217, 119, 6, 0.1);
            color: #d97706;
        }
        
        /* Animação de entrada */
        .login-card {
            animation: slideUp 0.6s ease-out;
        }
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        /* Efeito de partículas no fundo */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                radial-gradient(circle at 20% 80%, rgba(255, 255, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255, 255, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(255, 255, 255, 0.05) 0%, transparent 50%);
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo">
            <i class="bi bi-boxes me-1"></i>Logi<span>-Prime</span>
        </div>
        <p class="logo-sub">Gestão de Estoque</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for cat, msg in messages %}
            <div class="alert alert-{{ cat }} py-2 small">{{ msg }}</div>
            {% endfor %}
        {% endif %}
        {% endwith %}

        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            <div class="mb-3">
                <label class="form-label fw-semibold">Login</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                    <input type="text" name="login" class="form-control" placeholder="Seu login" required autofocus>
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label fw-semibold">Senha</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" name="senha" class="form-control" placeholder="Sua senha" required>
                </div>
            </div>
            <button type="submit" class="btn-login">
                <i class="bi bi-box-arrow-in-right me-2"></i>Entrar
            </button>
        </form>
        <p class="version">Logi-Prime v1.0 · Gestão Inteligente de Estoque</p>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

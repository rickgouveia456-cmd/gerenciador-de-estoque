<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 76" fill="none">
  <defs>
    <linearGradient id="gFront" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#e06520"/>
      <stop offset="100%" stop-color="#b04010"/>
    </linearGradient>
    <linearGradient id="gRight" x1="0" y1="0.5" x2="1" y2="0.5">
      <stop offset="0%" stop-color="#c85010"/>
      <stop offset="100%" stop-color="#8a3008"/>
    </linearGradient>
    <linearGradient id="gLid" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#e87030"/>
      <stop offset="100%" stop-color="#f08040"/>
    </linearGradient>
    <linearGradient id="gArrow" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#e06520"/>
      <stop offset="100%" stop-color="#f09050"/>
    </linearGradient>
  </defs>

  <!-- ═══════════════════════════════════════
       CAIXA ISOMÉTRICA ABERTA
       ═══════════════════════════════════════ -->

  <!-- Corpo inferior esquerdo (face frontal) -->
  <path d="M3 36 L3 55 L27 62 L27 43 Z"          fill="url(#gFront)"/>

  <!-- Corpo inferior direito (face lateral) -->
  <path d="M27 43 L27 62 L51 55 L51 36 Z"         fill="url(#gRight)"/>

  <!-- Linha divisória do corpo -->
  <path d="M27 43 L27 62"                          stroke="#7a2a08" stroke-width="0.8"/>

  <!-- ── Tampas abertas (simétricas, inclinadas para fora) ── -->

  <!-- Tampa esquerda — abre para a esquerda e cima -->
  <path d="M3 36 L3 25 L15 18 L27 25 L27 36 Z"    fill="url(#gLid)"/>

  <!-- Tampa direita — abre para a direita e cima -->
  <path d="M27 25 L39 18 L51 25 L51 36 L27 36 Z"  fill="url(#gRight)" opacity="0.9"/>

  <!-- Linha de topo da caixa (junção tampas/corpo) -->
  <path d="M3 36 L27 43 L51 36"                    stroke="#8a3008" stroke-width="0.7" opacity="0.7"/>

  <!-- Linha de cume das tampas -->
  <path d="M3 25 L27 32 L51 25"                    stroke="#f0a060" stroke-width="0.5" opacity="0.4"/>

  <!-- Detalhe de vinco tampa esquerda -->
  <path d="M3 30 L15 23 L27 30"                    stroke="#f0a060" stroke-width="0.5" opacity="0.35"/>

  <!-- Detalhe de vinco tampa direita -->
  <path d="M27 30 L39 23 L51 30"                   stroke="#7a2a08" stroke-width="0.4" opacity="0.35"/>

  <!-- ── Seta saindo da caixa ── -->
  <!-- Haste da seta — diagonal longa para cima-direita -->
  <line x1="24" y1="30" x2="42" y2="6"
        stroke="url(#gArrow)" stroke-width="5" stroke-linecap="round"/>

  <!-- Ponta da seta (cabeça) -->
  <path d="M37 2 L48 5 L45 16 Z"                  fill="url(#gArrow)"/>

  <!-- ═══════════════════════════════════════
       TEXTO — igual à imagem de referência
       cor cinza-azulado escuro, bold
       ═══════════════════════════════════════ -->
  <text x="65" y="46"
        font-family="'Segoe UI Black','Arial Black','Helvetica Neue',Arial,sans-serif"
        font-size="30" font-weight="900"
        fill="#3d4f63">Logi-Prime</text>

  <text x="66" y="60"
        font-family="'Segoe UI',Arial,sans-serif"
        font-size="7.5" font-weight="400"
        fill="#94a3b8" letter-spacing="3">GESTÃO DE OBRA</text>
</svg>

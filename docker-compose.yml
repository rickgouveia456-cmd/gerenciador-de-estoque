version: "3.9"

services:
  app:
    build: .
    container_name: logiprime_python
    ports:
      - "${APP_PORT:-80}:5000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-logiprime}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-logiprime}
      SECRET_KEY: ${SECRET_KEY}
      PORT: 5000
    depends_on:
      db:
        condition: service_healthy
    restart: always
    networks:
      - logiprime_net

  db:
    image: postgres:15-alpine
    container_name: logiprime_postgres
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-logiprime}
      POSTGRES_USER:     ${POSTGRES_USER:-logiprime}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-logiprime}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: always
    networks:
      - logiprime_net

volumes:
  postgres_data:

networks:
  logiprime_net:
    driver: bridge
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 44" fill="none">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff8a50"/>
      <stop offset="100%" stop-color="#e83d00"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff6b35"/>
      <stop offset="100%" stop-color="#cc2e00"/>
    </linearGradient>
  </defs>

  <!-- ── Letra L ── -->
  <rect x="2"  y="4"  width="7" height="36" rx="1.5" fill="#1e293b"/>
  <rect x="2"  y="33" width="26" height="7" rx="1.5" fill="#1e293b"/>

  <!-- ── Pirâmide de caixas ── -->
  <!-- Nível base (3 caixas) -->
  <rect x="2"  y="20" width="7" height="7" rx="1" fill="url(#g2)"/>
  <rect x="11" y="20" width="7" height="7" rx="1" fill="url(#g1)"/>
  <rect x="20" y="20" width="7" height="7" rx="1" fill="url(#g2)"/>
  <!-- Nível 2 (2 caixas) -->
  <rect x="6"  y="11" width="7" height="7" rx="1" fill="url(#g1)"/>
  <rect x="15" y="11" width="7" height="7" rx="1" fill="url(#g2)"/>
  <!-- Topo (1 caixa) -->
  <rect x="10" y="3"  width="7" height="7" rx="1" fill="#ff6b35" stroke="#ffaa80" stroke-width="0.6"/>

  <!-- ── Texto "Logi-Prime" ── -->
  <text x="36" y="26"
        font-family="'Segoe UI Black','Arial Black',sans-serif"
        font-size="16" font-weight="900" fill="#1e293b">Logi</text>
  <text x="74" y="26"
        font-family="'Segoe UI Black','Arial Black',sans-serif"
        font-size="16" font-weight="900" fill="#ff6b35">-Prime</text>

  <!-- Subtítulo -->
  <text x="37" y="36"
        font-family="'Segoe UI',Arial,sans-serif"
        font-size="5.5" fill="#94a3b8" letter-spacing="1.8">GESTÃO DE OBRA</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" fill="none">
  <defs>
    <linearGradient id="gOrange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff6b35"/>
      <stop offset="100%" stop-color="#ff3d00"/>
    </linearGradient>
  </defs>

  <!-- Ícone: caixa aberta com seta saindo -->
  <!-- Corpo da caixa -->
  <rect x="4" y="22" width="38" height="28" rx="3" fill="#1e293b" stroke="#ff6b35" stroke-width="2"/>
  <!-- Tampa aberta (lado esquerdo) -->
  <path d="M4 22 L14 14 L42 14" stroke="#ff6b35" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Tampa direita -->
  <path d="M42 22 L42 14" stroke="#ff6b35" stroke-width="2" stroke-linecap="round"/>
  <!-- Seta saindo da caixa (para cima, cor laranja sólida) -->
  <path d="M23 36 L23 20" stroke="url(#gOrange)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M17 26 L23 19 L29 26" stroke="url(#gOrange)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Texto "Logi" -->
  <text x="54" y="38"
        font-family="'Segoe UI',Arial,sans-serif"
        font-size="22"
        font-weight="700"
        fill="#1e293b"
        letter-spacing="-0.5">Logi</text>

  <!-- Texto "-Prime" em laranja -->
  <text x="96" y="38"
        font-family="'Segoe UI',Arial,sans-serif"
        font-size="22"
        font-weight="700"
        fill="url(#gOrange)"
        letter-spacing="-0.5">-Prime</text>

  <!-- Subtítulo pequeno -->
  <text x="54" y="50"
        font-family="'Segoe UI',Arial,sans-serif"
        font-size="8"
        font-weight="400"
        fill="#64748b"
        letter-spacing="1.5">GESTÃO DE OBRA</text>
</svg>

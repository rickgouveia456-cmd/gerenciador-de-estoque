version: "3.9"

# ============================================================
# Logi-Prime — Producao (Servidor Dedicado)
# ============================================================

services:
  app:
    build: .
    container_name: logiprime_php
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./src:/var/www/html
      - ./logs/php:/var/log/apache2
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-logiprime}
      DB_USER: ${DB_USER:-logiprime}
      DB_PASS: ${DB_PASS}
      APP_ENV: ${APP_ENV:-production}
      APP_SECRET: ${APP_SECRET}
      APP_URL: ${APP_URL}
      PHP_MEMORY_LIMIT: ${PHP_MEMORY_LIMIT:-256M}
      PHP_MAX_EXECUTION_TIME: ${PHP_MAX_EXECUTION_TIME:-60}
      PHP_UPLOAD_MAX_FILESIZE: ${PHP_UPLOAD_MAX_FILESIZE:-20M}
      PHP_POST_MAX_SIZE: ${PHP_POST_MAX_SIZE:-25M}
    depends_on:
      db:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - logiprime_net

  db:
    image: mysql:8.0
    container_name: logiprime_mysql
    ports:
      - "127.0.0.1:3306:3306"   # Só localhost — não expõe externamente
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-logiprime}
      MYSQL_USER: ${DB_USER:-logiprime}
      MYSQL_PASSWORD: ${DB_PASS}
    volumes:
      - db_data:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./sql/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
      - ./mysql.cnf:/etc/mysql/conf.d/logiprime.cnf:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: always
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - logiprime_net

  # phpMyAdmin — desabilitar em producao se nao precisar
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: logiprime_pma
    ports:
      - "127.0.0.1:8081:80"    # Só localhost
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: ${DB_USER:-logiprime}
      PMA_PASSWORD: ${DB_PASS}
      UPLOAD_LIMIT: 20M
    depends_on:
      - db
    restart: unless-stopped
    profiles:
      - admin    # Só sobe com: docker compose --profile admin up
    networks:
      - logiprime_net

volumes:
  db_data:
    driver: local

networks:
  logiprime_net:
    driver: bridge
{% extends 'base.html' %}
{% block title %}{% if almoxarifado %}Editar{% else %}Novo{% endif %} Almoxarifado{% endblock %}
{% block page_title %}{% if almoxarifado %}Editar Almoxarifado{% else %}Novo Almoxarifado{% endif %}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-0 shadow-sm">
            <div class="card-body p-4">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Nome do Almoxarifado *</label>
                        <input type="text" name="nome" class="form-control" required
                               value="{{ almoxarifado.nome if almoxarifado else '' }}"
                               placeholder="Ex: Almoxarifado do Acampamento">
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold">Descrição</label>
                        <textarea name="descricao" class="form-control" rows="3"
                                  placeholder="Descrição opcional">{{ almoxarifado.descricao if almoxarifado else '' }}</textarea>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-lg me-1"></i>
                            {% if almoxarifado %}Salvar{% else %}Criar{% endif %}
                        </button>
                        <a href="/" class="btn btn-outline-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

services:
  app:
    build: .
    container_name: logiprime_python
    env_file:
      - .env
    ports:
      - "${APP_PORT}:5000"
    depends_on:
      db:
        condition: service_healthy
    restart: always
    networks:
      - logiprime_net

  db:
    image: mariadb:11
    container_name: logiprime_mariadb
    env_file:
      - .env
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./init_db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: always
    networks:
      - logiprime_net

volumes:
  mariadb_data:

networks:
  logiprime_net:
    driver: bridge

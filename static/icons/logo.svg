<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Fundo circular com gradiente -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff3d00;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Fundo circular escuro -->
  <circle cx="100" cy="100" r="96" fill="url(#grad2)" />

  <!-- Caixa inferior (maior) -->
  <rect x="35" y="115" width="130" height="45" rx="6" fill="url(#grad)" opacity="0.9"/>
  <!-- Detalhe superior da caixa inferior -->
  <rect x="35" y="113" width="130" height="8" rx="3" fill="#ff8a50"/>
  <!-- Linha central da caixa inferior -->
  <rect x="96" y="115" width="4" height="45" fill="#ff3d00" opacity="0.4"/>
  <!-- Alça da caixa inferior -->
  <rect x="77" y="108" width="20" height="10" rx="3" fill="#ff8a50" stroke="#ff6b35" stroke-width="1"/>
  <rect x="99" y="108" width="20" height="10" rx="3" fill="#ff8a50" stroke="#ff6b35" stroke-width="1"/>

  <!-- Caixa superior (menor, levemente inclinada) -->
  <rect x="52" y="70" width="96" height="38" rx="6" fill="white" opacity="0.15"/>
  <rect x="52" y="70" width="96" height="38" rx="6" fill="url(#grad)" opacity="0.7"/>
  <!-- Detalhe superior da caixa superior -->
  <rect x="52" y="68" width="96" height="7" rx="3" fill="#ff8a50"/>
  <!-- Linha central da caixa superior -->
  <rect x="97" y="70" width="3" height="38" fill="#ff3d00" opacity="0.4"/>
  <!-- Alça da caixa superior -->
  <rect x="80" y="62" width="16" height="9" rx="3" fill="#ff8a50" stroke="#ff6b35" stroke-width="1"/>
  <rect x="100" y="62" width="16" height="9" rx="3" fill="#ff8a50" stroke="#ff6b35" stroke-width="1"/>

  <!-- Letra L estilizada em branco -->
  <text x="68" y="101" font-family="'Segoe UI',Arial,sans-serif" font-size="28" font-weight="800" fill="white" opacity="0.95">LP</text>
</svg>

services:
  app:
    build: .
    container_name: logiprime_python
    env_file:
      - .env
    ports:
      - "${APP_PORT:-80}:5000"
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-logiprime}:${MYSQL_PASSWORD:-logiprime123}@db:3306/${MYSQL_DATABASE:-logiprime}?charset=utf8mb4
      SECRET_KEY:   ${SECRET_KEY:-logiprime_dev_secret_2024}
      PORT:         5000
    depends_on:
      db:
        condition: service_healthy
    restart: always
    networks:
      - logiprime_net

  db:
    image: mariadb:11
    container_name: logiprime_mariadb
    env_file:
      - .env
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_DATABASE:      ${MYSQL_DATABASE:-logiprime}
      MYSQL_USER:          ${MYSQL_USER:-logiprime}
      MYSQL_PASSWORD:      ${MYSQL_PASSWORD:-logiprime123}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_logiprime_2024}
      MYSQL_CHARSET:       utf8mb4
      MYSQL_COLLATION:     utf8mb4_unicode_ci
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./init_db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: always
    networks:
      - logiprime_net

volumes:
  mariadb_data:

networks:
  logiprime_net:
    driver: bridge

{% extends 'base.html' %}
{% block title %}Nova Requisição{% endblock %}
{% block page_title %}Nova Requisição de Material / EPI{% endblock %}

{% block content %}
<form method="POST" action="/requisicoes/nova" id="formReq">
    <div class="card border-0 shadow-sm mb-4">
        <div class="card-header fw-bold text-white" style="background:var(--accent)">
            <i class="bi bi-person-check me-2"></i>Dados da Requisição
        </div>
        <div class="card-body">
            <div class="row g-3">
                <div class="col-12 col-md-4">
                    <label class="form-label fw-semibold">Colaborador *</label>
                    <input type="text" name="colaborador" class="form-control"
                           placeholder="Nome do colaborador" required>
                </div>
                <div class="col-12 col-md-4">
                    <label class="form-label fw-semibold">Almoxarifado *</label>
                    <select name="almoxarifado_id" id="selectAlmox" class="form-select" required>
                        <option value="">Selecione...</option>
                        {% for alm in almoxarifados %}
                        <option value="{{ alm.id }}">{{ alm.nome }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-12 col-md-4">
                    <label class="form-label fw-semibold">Observação</label>
                    <input type="text" name="observacao" class="form-control" placeholder="Opcional">
                </div>
            </div>
        </div>
    </div>

    <div class="card border-0 shadow-sm mb-3">
        <div class="card-header fw-bold text-white d-flex justify-content-between align-items-center"
             style="background:var(--accent)">
            <span><i class="bi bi-box-seam me-2"></i>Itens Requisitados</span>
            <button type="button" class="btn btn-sm btn-warning fw-bold" onclick="adicionarLinha()">
                <i class="bi bi-plus-lg me-1"></i> Adicionar Item
            </button>
        </div>
        <div class="card-body p-2" id="listaItens"></div>
    </div>

    <div class="d-flex gap-2 justify-content-end">
        <a href="/requisicoes" class="btn btn-outline-secondary">Cancelar</a>
        <button type="submit" class="btn btn-primary px-4">
            <i class="bi bi-check-lg me-1"></i> Registrar Requisição
        </button>
    </div>
</form>

<script>
const itensPorAlmox = {{ itens_json | safe }};
let linhaCount = 0;

function getItens() {
    return itensPorAlmox[document.getElementById('selectAlmox').value] || [];
}

function buildSelect(idx) {
    const itens = getItens();
    let opts = '<option value="">Selecione o insumo...</option>';
    itens.forEach(it => {
        opts += `<option value="${it.id}" data-qtd="${it.quantidade}" data-un="${it.unidade}">${it.nome} (${it.quantidade} ${it.unidade})</option>`;
    });
    return `<select name="item_id_${idx}" class="form-select form-select-sm" required onchange="atualizarBadge(this,${idx})">${opts}</select>`;
}

function atualizarBadge(sel, idx) {
    const opt = sel.options[sel.selectedIndex];
    const qtd = parseFloat(opt.dataset.qtd || 0);
    const un  = opt.dataset.un || '';
    const b = document.getElementById(`badge_${idx}`);
    if (!b) return;
    b.innerHTML = qtd <= 0
        ? `<span class="badge bg-danger">🔴 Zerado</span>`
        : `<span class="badge bg-success">🟢 ${qtd} ${un}</span>`;
}

function adicionarLinha() {
    const idx = linhaCount++;
    const div = document.createElement('div');
    div.id = `linha_${idx}`;
    div.className = 'row g-2 align-items-center mb-2 p-2 border rounded';
    div.innerHTML = `
        <div class="col-12 col-md-5">${buildSelect(idx)}</div>
        <div class="col-6 col-md-2">
            <input type="number" name="quantidade_${idx}" class="form-control form-control-sm"
                   step="0.01" min="0.01" required placeholder="Qtd">
        </div>
        <div class="col-4 col-md-3" id="badge_${idx}"></div>
        <div class="col-2 col-md-2 text-end">
            <button type="button" class="btn btn-sm btn-outline-danger" onclick="remover(${idx})">
                <i class="bi bi-trash"></i>
            </button>
        </div>
    `;
    document.getElementById('listaItens').appendChild(div);
}

function remover(idx) {
    const el = document.getElementById(`linha_${idx}`);
    if (el) el.remove();
}

document.getElementById('selectAlmox').addEventListener('change', () => {
    document.getElementById('listaItens').innerHTML = '';
    linhaCount = 0;
    adicionarLinha();
});

adicionarLinha();
</script>
{% endblock %}

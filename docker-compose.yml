services:
  app:
    build: .
    container_name: logiprime_php
    env_file:
      - .env
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./src:/var/www/html
      - ./logs/php:/var/log/apache2
    depends_on:
      db:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - logiprime_net

  db:
    image: mariadb:11
    container_name: logiprime_mariadb
    env_file:
      - .env
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MARIADB_DATABASE:      ${DB_NAME}
      MARIADB_USER:          ${DB_USER}
      MARIADB_PASSWORD:      ${DB_PASS}
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: always
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - logiprime_net

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: logiprime_pma
    ports:
      - "127.0.0.1:8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: ${DB_USER}
      PMA_PASSWORD: ${DB_PASS}
      UPLOAD_LIMIT: 20M
    depends_on:
      - db
    restart: unless-stopped
    profiles:
      - admin
    networks:
      - logiprime_net

volumes:
  mariadb_data:
    driver: local

networks:
  logiprime_net:
    driver: bridge

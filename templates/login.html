<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Logi-Prime</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: linear-gradient(135deg, #ff6b35 0%, #ff8a50 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
        }

        /* ── Caixas flutuando no fundo ── */
        .boxes-bg {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }
        .box {
            position: absolute;
            bottom: -80px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 8px;
            animation: stackUp linear infinite;
        }
        .box:nth-child(1)  { width:40px;  height:40px;  left:8%;   animation-duration:8s;  animation-delay:0s;   }
        .box:nth-child(2)  { width:25px;  height:25px;  left:18%;  animation-duration:12s; animation-delay:2s;   }
        .box:nth-child(3)  { width:55px;  height:55px;  left:28%;  animation-duration:9s;  animation-delay:1s;   }
        .box:nth-child(4)  { width:30px;  height:30px;  left:38%;  animation-duration:14s; animation-delay:3s;   }
        .box:nth-child(5)  { width:45px;  height:45px;  left:50%;  animation-duration:10s; animation-delay:0.5s; }
        .box:nth-child(6)  { width:20px;  height:20px;  left:60%;  animation-duration:11s; animation-delay:4s;   }
        .box:nth-child(7)  { width:60px;  height:60px;  left:70%;  animation-duration:7s;  animation-delay:1.5s; }
        .box:nth-child(8)  { width:35px;  height:35px;  left:80%;  animation-duration:13s; animation-delay:2.5s; }
        .box:nth-child(9)  { width:28px;  height:28px;  left:90%;  animation-duration:9s;  animation-delay:0.8s; }
        .box:nth-child(10) { width:50px;  height:50px;  left:5%;   animation-duration:15s; animation-delay:3.5s; }

        @keyframes stackUp {
            0%   { transform: translateY(0)   rotate(0deg);   opacity: 0; }
            10%  { opacity: 1; }
            90%  { opacity: 1; }
            100% { transform: translateY(-110vh) rotate(720deg); opacity: 0; }
        }

        /* ── Card de login ── */
        .login-wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            padding: 16px;
        }

        .login-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 48px 40px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
            animation: slideUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px) scale(0.97); }
            to   { opacity: 1; transform: translateY(0)    scale(1);    }
        }

        .logo {
            text-align: center;
            font-size: 2.2rem;
            font-weight: 900;
            letter-spacing: -1px;
            margin-bottom: 6px;
            background: linear-gradient(135deg, #ff6b35, #ff8a50);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: fadeIn 0.8s ease 0.3s both;
        }

        .logo-sub {
            text-align: center;
            font-size: 0.78rem;
            color: #94a3b8;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            margin-bottom: 36px;
            font-weight: 500;
            animation: fadeIn 0.8s ease 0.4s both;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* Campos animados individualmente */
        .field-group:nth-child(1) { animation: fadeIn 0.6s ease 0.5s both; }
        .field-group:nth-child(2) { animation: fadeIn 0.6s ease 0.6s both; }
        .btn-wrap                 { animation: fadeIn 0.6s ease 0.7s both; }

        .form-label {
            color: #1e293b;
            font-weight: 600;
            font-size: 0.88rem;
            margin-bottom: 6px;
        }

        .input-group-text {
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            border-right: none;
            color: #94a3b8;
            border-radius: 10px 0 0 10px;
            transition: all 0.2s;
        }

        .form-control {
            border: 2px solid #e2e8f0;
            border-left: none;
            border-radius: 0 10px 10px 0;
            padding: 12px 14px;
            font-size: 0.95rem;
            color: #1e293b;
            transition: all 0.2s;
        }

        .input-group:focus-within .input-group-text,
        .input-group:focus-within .form-control {
            border-color: #ff6b35;
        }

        .form-control:focus {
            box-shadow: none;
            outline: none;
        }

        .btn-login {
            background: linear-gradient(135deg, #ff6b35 0%, #ff8a50 100%);
            border: none;
            color: #fff;
            padding: 14px;
            font-weight: 700;
            border-radius: 12px;
            width: 100%;
            font-size: 1rem;
            letter-spacing: 0.3px;
            transition: all 0.25s ease;
            box-shadow: 0 4px 15px rgba(255,107,53,0.35);
            cursor: pointer;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255,107,53,0.45);
        }

        .btn-login:active { transform: translateY(0); }

        .version {
            text-align: center;
            font-size: 0.72rem;
            color: #cbd5e1;
            margin-top: 28px;
        }

        .alert {
            border-radius: 10px;
            border: none;
            font-size: 0.88rem;
            padding: 10px 14px;
            margin-bottom: 20px;
        }
        .alert-danger  { background: rgba(220,38,38,0.08);  color: #dc2626; }
        .alert-success { background: rgba(5,150,105,0.08);  color: #059669; }
        .alert-warning { background: rgba(217,119,6,0.08);  color: #d97706; }
    </style>
</head>
<body>

    <!-- Caixas animadas no fundo -->
    <div class="boxes-bg">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
    </div>

    <div class="login-wrapper">
        <div class="login-card">

            <div class="logo">
                <i class="bi bi-boxes me-1"></i>Logi<span style="-webkit-text-fill-color:#ff5722">-Prime</span>
            </div>
            <p class="logo-sub">Gestão de Estoque</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for cat, msg in messages %}
                <div class="alert alert-{{ cat }}">
                    <i class="bi bi-{% if cat == 'danger' %}x-circle{% elif cat == 'success' %}check-circle{% else %}exclamation-triangle{% endif %} me-2"></i>{{ msg }}
                </div>
                {% endfor %}
            {% endif %}
            {% endwith %}

            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

                <div class="mb-3 field-group">
                    <label class="form-label">Login</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input type="text" name="login" class="form-control"
                               placeholder="Seu login" required autofocus>
                    </div>
                </div>

                <div class="mb-4 field-group">
                    <label class="form-label">Senha</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" name="senha" class="form-control"
                               placeholder="Sua senha" required>
                    </div>
                </div>

                <div class="btn-wrap">
                    <button type="submit" class="btn-login">
                        <i class="bi bi-box-arrow-in-right me-2"></i>Entrar
                    </button>
                </div>
            </form>

            <p class="version">Logi-Prime v1.0 · Gestão Inteligente de Estoque</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
